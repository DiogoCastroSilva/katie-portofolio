name: CI & Deploy

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read
  deployments: write # needed if deploying to GitHub Pages

jobs:
  # 1️⃣ Continuous Integration (Lint, Test, Build)
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      # Optional Nx Cloud task distribution (uncomment if using Nx Cloud)
      # - run: npx nx-cloud start-ci-run --distribute-on="3 linux-medium-js"

      - name: Run CI Tasks
        run: npx nx run-many -t lint test build typecheck

      - name: Nx Cloud Fix Suggestions
        if: always()
        run: npx nx fix-ci

  # 2️⃣ Deploy job – runs only if CI passes
  deploy:
    runs-on: ubuntu-latest
    needs: ci # ensures CI completes successfully first

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      # Rebuild the app (optional if artifact is uploaded)
      - run: npx nx build main

      # Show what will be published so CI logs include the files (debugging)
      - name: Show publish directory contents
        run: |
          echo "Listing candidate publish folders (for GitHub Pages):"
          echo "apps/main/out ->"; ls -la apps/main/out || echo "(no apps/main/out)"
          echo ".next ->"; ls -la apps/main/.next || echo "(no apps/main/.next)"

      # Example for GitHub Pages deploy:
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Publish the static export generated by the Next build (if present)
          publish_dir: apps/main/out
