name: CI & Deploy

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  # 1️⃣ Continuous Integration (Lint, Test, Build)
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Nx workspace
        run: npx nx --version

      - name: Run CI Tasks
        run: npx nx run-many -t lint test typecheck build

      - name: Nx Cloud Fix Suggestions
        if: always()
        run: npx nx fix-ci


  # 2️⃣ Deploy job – runs only if CI passes
  deploy:
    runs-on: ubuntu-latest
    needs: ci

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure Nx is available
        run: npx nx --version

      # ✅ Build and export Next.js app the Nx way
      - name: Build Next.js app
        run: npx nx build main

      - name: Show exported output
        run: ls -R public

      # ✅ Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
