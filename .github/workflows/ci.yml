name: CI & Deploy

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read
  deployments: write # needed if deploying to GitHub Pages

jobs:
  # 1️⃣ Continuous Integration (Lint, Test, Build)
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      # Optional Nx Cloud task distribution (uncomment if using Nx Cloud)
      # - run: npx nx-cloud start-ci-run --distribute-on="3 linux-medium-js"

      - name: Run CI Tasks
        run: npx nx run-many -t lint test build typecheck

      - name: Nx Cloud Fix Suggestions
        if: always()
        run: npx nx fix-ci

  # 2️⃣ Deploy job – runs only if CI passes
  deploy:
    runs-on: ubuntu-latest
    needs: ci # ensures CI completes successfully first

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Build and export Next.js app
        run: npx nx build main

      - name: Show export output
        run: ls -la apps/main/dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/main/dist
